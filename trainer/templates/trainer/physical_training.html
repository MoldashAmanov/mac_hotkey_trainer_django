{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Физическая тренировка</h1>

<div class="question-card">
    <p>Действие: <strong id="action"></strong></p>
    <div id="pressed-keys" class="pressed-keys">Нажмите сочетание...</div>
    <div id="feedback" class="feedback"></div>
    <button id="skip-button" class="button secondary">Пропустить</button>
</div>

<div class="stats">
    <div>Верно: <span id="correct-count">0</span></div>
    <div>Ошибок: <span id="wrong-count">0</span></div>
    <div>Осталось: <span id="remaining">{{ items|length }}</span></div>
</div>
{% endblock %}

{% block scripts %}
{{ items|json_script:'physical-training-data' }}
<script>
    const checkUrl = "{% url 'trainer:api_check_answer' %}";
</script>
<script src="{% static 'js/physical_trainer.js' %}"></script>
{% endblock %}
